<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore sampling, the Nyquist frequency, aliasing, and the Fourier transform of a sinusoid.">
  <title>Nyquist Sampling Demonstrator</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23173554'/%3E%3Cpath d='M3 16Q9 0 16 16T29 16' fill='none' stroke='%235ad5e0' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main>
  <header>
    <h1>Nyquist sampling</h1>
  </header>

  <div class="workspace">
  <section class="panel control-panel" aria-label="Signal controls and derived quantities">
    <div class="controls">
      <div class="control">
        <label for="frequency">Signal <span>Hz</span></label>
        <input id="frequency" aria-label="Signal frequency in Hz" type="number" min="0.01" max="10" step="any" value="1" inputmode="decimal" aria-describedby="frequency-help">
        <input id="frequency-slider" type="range" min="0.01" max="10" step="0.01" value="1" aria-label="True signal frequency in Hz">
        <small id="frequency-help" class="sr-only">0.01–10 Hz</small>
      </div>
      <div class="control">
        <label for="cadence">Cadence Δt <span>s</span></label>
        <input id="cadence" type="number" min="0.01" max="2" step="any" value="0.25" inputmode="decimal" aria-describedby="cadence-help">
        <input id="cadence-slider" type="range" min="0.01" max="2" step="0.01" value="0.25" aria-label="Sampling cadence in seconds">
        <small id="cadence-help" class="sr-only">0.01–2 s · sets the Nyquist limit</small>
      </div>
      <div class="control">
        <label for="duration">Duration T <span>s</span></label>
        <input id="duration" type="number" min="0.02" max="30" step="any" value="10" inputmode="decimal" aria-describedby="duration-help">
        <input id="duration-slider" type="range" min="0.02" max="30" step="0.01" value="10" aria-label="Time-series duration in seconds">
        <small id="duration-help" class="sr-only">0.02–30 s · sets frequency resolution</small>
      </div>
    </div>
    <dl class="metrics" aria-label="Derived quantities">
      <div><dt>Sampling f<sub>s</sub></dt><dd id="sampling-value"></dd></div>
      <div><dt>Nyquist</dt><dd id="nyquist-value"></dd></div>
      <div><dt>Samples</dt><dd id="samples-value"></dd></div>
      <div><dt>Resolution ≈ 1/T</dt><dd id="resolution-value"></dd></div>
      <div><dt>Observed</dt><dd id="alias-value"></dd></div>
    </dl>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </section>

  <div class="plots">
  <section class="panel plot-panel" aria-labelledby="time-heading">
    <div class="plot-heading"><h2 id="time-heading">Time domain</h2><div class="legend"><span class="true">Signal</span><span class="samples">Samples</span><span class="alias" id="alias-legend" hidden>Alias</span></div></div>
    <div id="time-plot" class="plot"></div>
  </section>

  <section class="panel plot-panel" aria-labelledby="fourier-heading">
    <div class="plot-heading"><h2 id="fourier-heading">Frequency domain</h2><p id="peak-value"></p></div>
    <div id="frequency-plot" class="plot"></div>
    <p id="spectrum-note" class="plot-note"></p>
  </section>

  </div>
  </div>

  <noscript>Please enable JavaScript to use this demonstrator.</noscript>
</main>
</body>
</html>
